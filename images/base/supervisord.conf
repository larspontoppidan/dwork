; supervisord runs as PID 1 (as hostuser). Program definitions live in conf.d/.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/dwork/supervisord.pid
childlogdir=/var/log/dwork
loglevel=info

[unix_http_server]
file=/run/dwork/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/dwork/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
