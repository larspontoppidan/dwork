; The application. Its command line comes from $DWORK_APP_CMD (see dwork-app).
; Control it from a shell inside the container:
;   supervisorctl status | restart app | stop app | tail -f app
[program:app]
command=/usr/local/bin/dwork-app
directory=%(ENV_HOME)s
autostart=%(ENV_DWORK_APP_AUTOSTART)s
autorestart=true
startsecs=3
startretries=1000
stopasgroup=true
killasgroup=true
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/var/log/dwork/app.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=90
