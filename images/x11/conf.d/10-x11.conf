; Virtual X11 desktop: X/VNC server, window manager, noVNC web client.
; Everything logs to /var/log/dwork/<program>.log; use `supervisorctl tail -f <program>`.

[program:xvnc]
command=/usr/bin/Xtigervnc %(ENV_DISPLAY)s
    -geometry %(ENV_DWORK_GEOMETRY)s -depth 24 -desktop dwork
    -rfbport %(ENV_DWORK_VNC_PORT)s -localhost=1 -SecurityTypes=None
    -AlwaysShared=1 -AcceptSetDesktopSize=1
autorestart=true
startsecs=2
startretries=1000
priority=10
redirect_stderr=true
stdout_logfile=/var/log/dwork/xvnc.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:openbox]
command=/usr/local/bin/dwork-wait-display /usr/bin/openbox
autorestart=true
startsecs=2
startretries=1000
priority=20
redirect_stderr=true
stdout_logfile=/var/log/dwork/openbox.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:xsetroot]
command=/usr/local/bin/dwork-wait-display /usr/bin/xsetroot -solid "#1f2430" -cursor_name left_ptr
autorestart=false
startsecs=0
exitcodes=0
priority=25
redirect_stderr=true
stdout_logfile=/var/log/dwork/xsetroot.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc %(ENV_DWORK_NOVNC_PORT)s localhost:%(ENV_DWORK_VNC_PORT)s
autorestart=true
startsecs=2
startretries=1000
priority=30
redirect_stderr=true
stdout_logfile=/var/log/dwork/novnc.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
